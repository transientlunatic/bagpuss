[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bagpuss"
version = "0.1.0"
description = "Simulated galaxy and gravitational-wave catalogues for cosmological inference testing"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "astropy>=6.0",
    "scipy>=1.11",
    "click>=8.1",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "h5py>=3.10",
    "zarr>=3.2.1",
]

[project.scripts]
bagpuss = "bagpuss.cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pyright>=1.1",
    "pre-commit>=3.7",
    "types-pyyaml>=6.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-autoapi>=3.0",
    "kentigern >= 0.3.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "ANN", # flake8-annotations
    "D",   # pydocstyle
]
ignore = [
    "D100", # missing docstring in public module (covered by module-level docstrings)
    "D105", # missing docstring in magic method
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[dependency-groups]
dev = [
    "pyright>=1.1.408",
]
