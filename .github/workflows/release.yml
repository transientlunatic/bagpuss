name: Release

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          init_version=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('bagpuss/__init__.py').read()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag pyproject=$version __init__=$init_version"
          [ "$tag" = "$version" ] && [ "$version" = "$init_version" ]
      - run: uv sync
      - run: uv run python -m unittest discover -s tests
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/bagpuss
    permissions:
      id-token: write # required for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
